name: Analyzer checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analyzer-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python 3.12 / Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install development dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.txt
      - name: Compile sources
        run: make compile
      - name: Check fixture reproducibility
        run: make check-fixtures
      - name: Run unit and regression tests
        run: make test
      - name: Validate synthetic scenarios and JSON exports
        run: make validate
      - name: Smoke-test runtime-only dependencies
        run: make check-runtime
      - name: Time large generated model (informational)
        run: make benchmark

  validate-windows:
    name: Python 3.12 / Windows
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-gui.txt
      - name: Install development and GUI dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements-dev.txt -r requirements-gui.txt
      - name: Compile sources
        run: .\.venv\Scripts\python.exe -m compileall -q pbi_usage_analyzer pbi_usage_analyzer_gui tests tools
      - name: Check fixture reproducibility
        run: .\.venv\Scripts\python.exe tools\validation\check_fixture_drift.py
      - name: Run unit, regression and offscreen GUI tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: .\.venv\Scripts\python.exe -m unittest discover -s tests -v
      - name: Validate synthetic scenarios and JSON exports
        run: .\.venv\Scripts\python.exe tools\validation\validate_analyzer.py . tools\validation\validation_suite
      - name: Smoke-test runtime-only dependencies
        run: .\.venv\Scripts\python.exe tools\validation\check_runtime.py
